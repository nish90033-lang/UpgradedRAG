[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartrag"
version = "2.0.0"
description = "SmartRAG v2: hybrid dense and lexical retrieval with reranking, trust filtering, and reproducible evaluation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "bcrypt>=4.1",
  "PyJWT[crypto]>=2.8",
  "psycopg[binary,pool]>=3.1",
  "python-multipart>=0.0.9",
  "certifi>=2023.7.22",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0"]
eval = ["scikit-learn>=1.4", "rank-bm25>=0.2.2"]
dev = ["pytest>=8", "ruff>=0.4", "scikit-learn>=1.4", "rank-bm25>=0.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
